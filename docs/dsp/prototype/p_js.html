  var W=760,H=230,padL=56,padR=16,padT=14,padB=30;

  function niceStep(span){
    if(span<=0) return 1;
    var raw=span/4, exp=Math.floor(Math.log10(raw)), f=raw/Math.pow(10,exp);
    var nf = f<=1?1 : f<=2?2 : f<=2.5?2.5 : f<=5?5 : 10;
    return nf*Math.pow(10,exp);
  }

  /** Draw one line chart. Returns geometry for the readout. */
  function plot(svg, opts){
    clear(svg);
    var cur=opts.cur, prior=opts.prior||[], labels=opts.labels, fmtAxis=opts.axis, zero=opts.zero!==false;
    var vals=cur.filter(function(v){return v!==null;});
    if(opts.showPrior) vals=vals.concat(prior.filter(function(v){return v!==null;}));
    var dMax=Math.max.apply(null,vals.concat([1])), dMin=zero?0:Math.min.apply(null,vals);
    var step=niceStep(dMax-dMin);
    var hi=Math.ceil(dMax/step)*step, lo=zero?0:Math.floor(dMin/step)*step;
    if(lo>=hi){lo=0;hi=Math.max(hi,step);}
    var ticks=Math.max(1,Math.round((hi-lo)/step));
    var n=cur.length;
    var x=function(i){return padL+i*(W-padL-padR)/(n-1);};
    var y=function(v){return padT+(1-(v-lo)/(hi-lo))*(H-padT-padB);};

    var defs=el("defs"), g=el("linearGradient",{id:opts.gid,x1:"0",y1:"0",x2:"0",y2:"1"});
    g.appendChild(el("stop",{offset:"0%","stop-color":C_PRIMARY,"stop-opacity":".15"}));
    g.appendChild(el("stop",{offset:"100%","stop-color":C_PRIMARY,"stop-opacity":"0"}));
    defs.appendChild(g); svg.appendChild(defs);

    for(var k=0;k<=ticks;k++){
      var v=lo+(hi-lo)*(k/ticks);
      svg.appendChild(el("line",{x1:padL,x2:W-padR,y1:y(v),y2:y(v),stroke:C_GRID,"stroke-width":"1"}));
      var tx=el("text",{x:padL-10,y:y(v)+3.5,"text-anchor":"end","font-size": "11",fill:C_INK3,
        "font-family":"Inter, sans-serif",style:"font-variant-numeric:tabular-nums"});
      tx.textContent=fmtAxis(v); svg.appendChild(tx);
    }
    if(!zero){
      var nz=el("text",{x:padL-10,y:H-padB+15,"text-anchor":"end","font-size": "11",fill:C_INK3,"font-family":"Inter, sans-serif"});
      nz.textContent="not zero"; svg.appendChild(nz);
    }

    function path(a){var d="",pen=false;a.forEach(function(v,i){
      if(v===null){pen=false;return;} d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)+" ";pen=true;});return d.trim();}

    var pts=[]; cur.forEach(function(v,i){if(v!==null)pts.push(x(i).toFixed(1)+","+y(v).toFixed(1));});
    if(pts.length>1){
      var base=(H-padB).toFixed(1);
      svg.appendChild(el("path",{d:"M"+pts[0].split(",")[0]+","+base+" L"+pts.join(" L")+" L"+pts[pts.length-1].split(",")[0]+","+base+" Z",
        fill:"url(#"+opts.gid+")"}));
    }
    if(opts.showPrior && prior.some(function(v){return v!==null;})){
      svg.appendChild(el("path",{d:path(prior),fill:"none",stroke:C_INK3,"stroke-width":"1.5",
        "stroke-dasharray":"3 3","stroke-opacity":".45","stroke-linecap":"round"}));
    }
    svg.appendChild(el("path",{d:path(cur),fill:"none",stroke:C_PRIMARY,"stroke-width":"2.25",
      "stroke-linecap":"round","stroke-linejoin":"round"}));
    for(var i=n-1;i>=0;i--){ if(cur[i]!==null){svg.appendChild(el("circle",{cx:x(i),cy:y(cur[i]),r:"3.5",fill:C_PRIMARY}));break;} }

    var stepLbl=Math.max(1,Math.ceil(n/6));
    labels.forEach(function(lab,i){
      if(i%stepLbl!==0 && i!==n-1) return;
      var t=el("text",{x:x(i),y:H-9,"font-size": "11",fill:C_INK3,"font-family":"Inter, sans-serif",
        "text-anchor":i===0?"start":(i===n-1?"end":"middle")});
      t.textContent=lab; svg.appendChild(t);
    });

    if(opts.interactive){
      svg.appendChild(el("line",{id:"xh",y1:padT,y2:H-padB,stroke:C_PRIMARY,"stroke-width":"1","stroke-opacity":".28",visibility:"hidden"}));
      svg.appendChild(el("circle",{id:"xd",r:"4.5",fill:"#fff",stroke:C_PRIMARY,"stroke-width":"2.5",visibility:"hidden"}));
    }
    return {x:x,y:y,n:n};
  }

  function show(i){
    if(!geom) return;
    var s=geom.s, v=s.cur[i];
    var c=svg.querySelector("#xh"), d=svg.querySelector("#xd");
    c.setAttribute("x1",geom.x(i)); c.setAttribute("x2",geom.x(i)); c.setAttribute("visibility","visible");
    if(v===null){ d.setAttribute("visibility","hidden"); }
    else { d.setAttribute("cx",geom.x(i)); d.setAttribute("cy",geom.y(v)); d.setAttribute("visibility","visible"); }
    var p = showPrior ? s.prior[i] : null;
    tip.innerHTML='<span class="w">'+LABELS[i]+'</span><span class="v">'+(v===null?"Not measured":s.read(v))+'</span>'+
      (p!==null&&p!==undefined?'<span class="p">'+s.read(p)+' previous period</span>':'');
    tip.setAttribute("data-on","1");
    var scale=wrap.clientWidth/W, px=geom.x(i)*scale, tw=tip.offsetWidth||130;
    tip.style.left=Math.max(4,Math.min(px+14,wrap.clientWidth-tw-4))+"px";
    tip.style.top="16px"; focus=i;
  }
  function hide(){
    tip.setAttribute("data-on","0"); focus=-1;
    var c=svg.querySelector("#xh"), d=svg.querySelector("#xd");
    if(c)c.setAttribute("visibility","hidden"); if(d)d.setAttribute("visibility","hidden");
  }
  function nearest(clientX){
    var r=svg.getBoundingClientRect(), vx=(clientX-r.left)/r.width*W, best=0, bd=Infinity;
    for(var i=0;i<geom.n;i++){var dd=Math.abs(geom.x(i)-vx);if(dd<bd){bd=dd;best=i;}}
    return best;

  // ── The rail ────────────────────────────────────────────────────
  //
  // Mirrors the review panel's five lines, but live from step one. It
  // reads the same elements the review does rather than keeping a
  // second copy of the state — a rail that can disagree with the
  // review is worse than no rail.
  var RAIL = [
    ["Goal",     "rGoal", 1],
    ["Where",    "rArea", 2],
    ["Audience", "rWho",  2],
    ["Channels", "rCh",   3],
    ["Video",    "rCv",   4],

  var railStep = 1;
  function paintRail(){
    var host = document.getElementById("railList");
    if (!host) return;
    var prev = {};
    host.querySelectorAll("li").forEach(function(li){ prev[li.dataset.k] = li.querySelector(".rv").textContent; });
    host.innerHTML = RAIL.map(function(r){
      var el = document.getElementById(r[1]);
      var done = railStep > r[2] || (railStep === r[2]);
      var val = done && el ? el.textContent : "Not set yet";
      return '<li class="' + (done ? "set" : "pend") + '" data-k="' + r[0] + '">' +
        '<span class="rk">' + r[0] + '</span><span class="rv">' + val + '</span></li>';
    }).join("");
    // Flag only what actually changed, so the animation marks news
    // rather than firing on every repaint.
    host.querySelectorAll("li").forEach(function(li){
      var k = li.dataset.k;
      if (prev[k] !== undefined && prev[k] !== li.querySelector(".rv").textContent) li.classList.add("fresh");
    });
    var bar = document.getElementById("railBar");
    if (bar) bar.style.width = (railStep / 5 * 100) + "%";
    var pc = document.getElementById("railPc");
    if (pc) pc.textContent = "Step " + railStep + " of 5";
  }

  function gotoStep(n, fromRoute){
    railStep = n;
    for(var i=1;i<=5;i++){
      var pane=document.getElementById("w"+i); if(pane) pane.classList.toggle("on",i===n);
    }
    // Writing the step into the hash makes Back go back a step rather
    // than out of the builder. When the router is what called us the
    // hash is already right, so writing it again would loop.
    if(!fromRoute){
      var want = "#/new" + (n > 1 ? "/" + n : "");
      if(location.hash !== want) location.hash = want;
    }
    document.querySelectorAll(".step").forEach(function(b){
      var i=Number(b.dataset.step);
      if(i===n) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", i<n);
    });
    paintRail();
    window.scrollTo(0,0);

  (function netFlow(){
    var host = document.getElementById("netFlow");
    if (!host) return;
    var track = host.querySelector(".track");
    var all = [];
    CHANNELS.forEach(function(g){ g[1].forEach(function(c){ all.push(c); }); });
    // Doubled, so translating the track by -50% lands exactly where it
    // started and the loop has no seam.
    var one = all.map(function(c){ return logoHtml(c[0], c[1], "fm"); }).join("");
    track.innerHTML = one + one;

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    // Lift one mark every few seconds — the weekly rebalance, at a speed
    // a person can see. Only while the card is the chosen mode and the
    // tab is visible; an animation running behind another tab is waste.
    var marks = track.querySelectorAll(".fm");
    setInterval(function(){
      if (document.hidden) return;
      var card = document.querySelector("[data-net='pgam']");
      if (!card || card.getAttribute("aria-pressed") !== "true") return;
      if (!host.offsetParent) return;
      var i = Math.floor(Date.now() / 3200) % all.length;
      [marks[i], marks[i + all.length]].forEach(function(m){
        if (!m) return;
        m.classList.remove("hot");
        void m.offsetWidth;
        m.classList.add("hot");
      });
    }, 3200);
  })();

  // Households reachable, by how the area is described. A radius scales
  // with area, so doubling the miles roughly quadruples the households —
  // which is exactly why 8 miles cost what it did.
  var RADIUS_HH = { "5":42000, "8":96000, "12":184000, "15":268000, "25":610000, "50":1980000 };
  var stSel = {Colorado:1, Utah:1, Wyoming:1};

  function fmtHH(n){
    return n >= 1e6 ? (n/1e6).toFixed(1)+"M" : Math.round(n/1000)*1000 >= 1000
      ? Math.round(n).toLocaleString("en-US") : String(n);
  }
  function geoHouseholds(){
    var mode = (document.querySelector("[data-geo][aria-pressed='true']")||{}).dataset;
    mode = mode ? mode.geo : "radius";
    if (mode === "radius") return RADIUS_HH[document.getElementById("geoRad").value] || 184000;
    if (mode === "zip") return zipList().length * 9200;            // ~9.2k households a ZIP
    if (mode === "states") {
      var n = Object.keys(stSel).length;
      var inc = (document.querySelector("[data-gmode][aria-pressed='true']")||{dataset:{}}).dataset.gmode !== "exclude";
      // 131M US households across 50 states; exclude flips the selection.
      return Math.round(131000000 * (inc ? n : 50 - n) / 50);
    }
    if (mode === "dma") return 0;
    return 131000000;
  }
  function zipList(){
    var v = document.getElementById("zipBox").value;
    return v.split(/[\s,;]+/).filter(function(z){ return /^\d{5}$/.test(z); });
  }
  function paintGeo(){
    var hh = geoHouseholds();
    // $42.23 is this account's own CPM — $81,920 over the 1.94M
    // impressions the Attention page counts — not a rate card. Frequency
    // is impressions / households, and it is the number that says whether
    // the area fits the budget: too wide and nobody sees it twice, too
    // narrow and the 5-a-day cap throws the money back.
    var imp = 12000 / 42.23 * 1000;
    document.getElementById("geoReach").textContent = hh ? fmtHH(hh) : "—";
    document.getElementById("geoImp").textContent = hh
      ? (imp >= 1e6 ? (imp/1e6).toFixed(2)+"M" : Math.round(imp).toLocaleString("en-US"))
      : "—";
    var f = hh ? imp/hh : 0;
    var el = document.getElementById("geoFreq");
    var note = document.getElementById("geoFreqNote");
    el.textContent = !hh ? "not available"
      : f < 0.01 ? "< 0.01 a month"
      : "≈ " + (f < 1 ? f.toFixed(2) : f.toFixed(1)) + " a month";
    // 150 a month is the 5-a-day cap. At the other end, below one a
    // month the average household never sees it at all, which is the
    // failure mode of widening the area without widening the budget.
    var bad = hh && (f < 1 || f > 150);
    el.style.color = bad ? "var(--warn-text)" : "";
    if (note) note.textContent = !hh ? "—"
      : f > 150 ? "above your 5-a-day cap — spend will under-deliver"
      : f < 1   ? "under once a household — too thin to register"
      : "inside the useful range";
  }

  // ── Dayparting ──────────────────────────────────────────────────
  var DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var dpOn = [];  // 7 x 24 booleans
  var DP_PRESETS = {
    all:     function(){ return true; },
    prime:   function(d,h){ return h >= 19 && h < 23; },
    daytime: function(d,h){ return h >= 9  && h < 17; },
    late:    function(d,h){ return h >= 23 || h < 2;  },
    morning: function(d,h){ return h >= 6  && h < 12; },
    weekend: function(d){ return d >= 5; }
  };
  function dpHours(){
    var n = 0;
    for (var d = 0; d < 7; d++) for (var h = 0; h < 24; h++) if (dpOn[d][h]) n++;
    return n;
  }
  /** Describe the selection in words, or say it cannot be summarised. */
  function dpDescribe(){
    var n = dpHours();
    if (n === 168) return "Any time, any day. Narrowing this is the commonest way a campaign " +
      "under-delivers — it is a hard filter, not a preference.";
    if (n === 0) return "Nothing selected. A campaign with no hours cannot deliver at all.";
    // Every selected day sharing one hour pattern is the common case and
    // the only one worth putting into a sentence.
    var days = [], pat = null, same = true;
    for (var d = 0; d < 7; d++) {
      var key = dpOn[d].map(function(v){ return v ? 1 : 0; }).join("");
      if (key.indexOf("1") < 0) continue;
      days.push(DAYS[d]);
      if (pat === null) pat = key; else if (pat !== key) same = false;
    }
    var span = "";
    if (same && pat) {
      var runs = [], start = -1;
      for (var h = 0; h <= 24; h++) {
        var on = h < 24 && pat[h] === "1";
        if (on && start < 0) start = h;
        if (!on && start >= 0) {
          runs.push(start === 0 && h === 24 ? "all day" : hLabel(start) + "–" + hLabel(h));
          start = -1;
        }
      }
      span = runs.join(", ");
    }
    var dayTxt = days.length === 7 ? "Every day"
      : days.length === 2 && days[0] === "Sat" ? "Weekends"
      : days.join(", ");
    return n + " of 168 hours" + (span ? " · " + dayTxt + " " + span : " selected across " + dayTxt) +
      ". Every hour you remove is inventory you cannot bid on.";
  }
  function hLabel(h){
    if (h === 0 || h === 24) return "12am";
    if (h === 12) return "12pm";
    return (h % 12) + (h < 12 ? "am" : "pm");
  }
  function paintDp(){
    for (var d = 0; d < 7; d++) for (var h = 0; h < 24; h++) {
      var c = document.getElementById("dp" + d + "_" + h);
      if (c) c.setAttribute("aria-pressed", String(!!dpOn[d][h]));
    }
    var n = dpHours();
    document.getElementById("dpCount").textContent = n + " of 168 hours";
    document.getElementById("dpRead").textContent = dpDescribe();
    // A preset lights up only when the grid matches it exactly, so the
    // chip can never claim a shape the grid is not in.
    document.querySelectorAll("[data-dp]").forEach(function(b){
      var f = DP_PRESETS[b.dataset.dp], match = true;
      for (var d2 = 0; d2 < 7 && match; d2++) for (var h2 = 0; h2 < 24; h2++)
        if (!!dpOn[d2][h2] !== !!f(d2, h2)) { match = false; break; }
      b.setAttribute("aria-pressed", String(match));
    });
  }
  function buildDp(){
    var host = document.getElementById("dpGrid");
    if (!host) return;
    for (var d = 0; d < 7; d++) { dpOn[d] = []; for (var h = 0; h < 24; h++) dpOn[d][h] = true; }
    var html = '<span></span>';
    for (var h3 = 0; h3 < 24; h3++)
      html += '<button class="dph" type="button" data-col="' + h3 + '" title="Toggle ' + hLabel(h3) +
        ' on every day">' + (h3 % 3 === 0 ? (h3 === 0 ? "12a" : h3 === 12 ? "12p" : (h3 % 12) + (h3 < 12 ? "a" : "p")) : "") + '</button>';
    for (var d3 = 0; d3 < 7; d3++) {
      html += '<button class="dpd" type="button" data-row="' + d3 + '" title="Toggle all of ' + DAYS[d3] + '">' + DAYS[d3] + '</button>';
      for (var h4 = 0; h4 < 24; h4++)
        html += '<button class="dpc" type="button" tabindex="-1" id="dp' + d3 + '_' + h4 +
          '" data-d="' + d3 + '" data-h="' + h4 + '" aria-pressed="true" aria-label="' +
          DAYS[d3] + ' ' + hLabel(h4) + '"></button>';
    }
    host.innerHTML = html;
    var first = document.getElementById("dp0_0");
    if (first) first.tabIndex = 0;

    var painting = false, paintTo = false;
    function setCell(d, h, v){ dpOn[d][h] = v; }
    host.addEventListener("mousedown", function(e){
      var c = e.target.closest(".dpc"); if (!c) return;
      painting = true;
      paintTo = c.getAttribute("aria-pressed") !== "true";
      setCell(+c.dataset.d, +c.dataset.h, paintTo); paintDp();
      e.preventDefault();
    });
    host.addEventListener("mouseover", function(e){
      if (!painting) return;
      var c = e.target.closest(".dpc"); if (!c) return;
      setCell(+c.dataset.d, +c.dataset.h, paintTo); paintDp();
    });
    document.addEventListener("mouseup", function(){ painting = false; });
    host.addEventListener("click", function(e){
      var row = e.target.closest("[data-row]"), col = e.target.closest("[data-col]");
      if (row) {
        var d = +row.dataset.row, allOn = dpOn[d].every(Boolean);
        for (var h = 0; h < 24; h++) dpOn[d][h] = !allOn;
        paintDp();
      } else if (col) {
        var hh = +col.dataset.col, colOn = true;
        for (var dd = 0; dd < 7; dd++) if (!dpOn[dd][hh]) colOn = false;
        for (var d2 = 0; d2 < 7; d2++) dpOn[d2][hh] = !colOn;
        paintDp();
      }
    });
    host.addEventListener("keydown", function(e){
      var c = e.target.closest(".dpc"); if (!c) return;
      var d = +c.dataset.d, h = +c.dataset.h, nd = d, nh = h;
      if (e.key === "ArrowRight") nh = Math.min(23, h + 1);
      else if (e.key === "ArrowLeft") nh = Math.max(0, h - 1);
      else if (e.key === "ArrowDown") nd = Math.min(6, d + 1);
      else if (e.key === "ArrowUp") nd = Math.max(0, d - 1);
      else if (e.key === " " || e.key === "Enter") { dpOn[d][h] = !dpOn[d][h]; paintDp(); e.preventDefault(); return; }
      else return;
      e.preventDefault();
      var next = document.getElementById("dp" + nd + "_" + nh);
      if (next) { c.tabIndex = -1; next.tabIndex = 0; next.focus(); }
    });
    document.querySelectorAll("[data-dp]").forEach(function(b){
      b.addEventListener("click", function(){
        var f = DP_PRESETS[b.dataset.dp];
        for (var d = 0; d < 7; d++) for (var h = 0; h < 24; h++) dpOn[d][h] = !!f(d, h);
        paintDp();
      });
    });
    paintDp();
  }
  buildDp();

  // ── Channel picker ──────────────────────────────────────────────
  //
  // Everything is selected by default. Deselecting is how an advertiser
  // narrows, and the reach counter makes the cost of each removal
  // visible — the opposite of an empty picker that has to be filled in.
  var chOff = {};
  function chTotals(){
    var sel=0, n=0, all=0;
    CHANNELS.forEach(function(g){ g[1].forEach(function(c){
      all++; if(!chOff[c[0]]){ sel+=c[2]; n++; } }); });
    return { sel: sel, n: n, all: all };
  }
  function chSummary(){
    var t = chTotals();
    return (t.n === t.all ? "All " + t.all : t.n + " of " + t.all) + " · " + t.sel.toFixed(1) + "M households";
  }
  /**
   * Roll a number to a new value instead of swapping it.
   *
   * A figure that jumps is read as a different figure; one that travels
   * is read as the same figure changing, which is what deselecting a
   * channel actually does to your reach. ~320ms, and prefers-reduced-
   * motion gets the destination immediately.
   */
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function rollTo(el, to, fmt){
    if (!el) return;
    var from = parseFloat(el.dataset.v);
    if (isNaN(from) || REDUCED) { el.dataset.v = to; el.textContent = fmt(to); return; }
    el.dataset.v = to;
    if (el._raf) cancelAnimationFrame(el._raf);
    var t0 = null, dur = 320;
    function step(ts){
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (k < 1) el._raf = requestAnimationFrame(step);
    }
    el._raf = requestAnimationFrame(step);
  }

    var t = chTotals();
    rollTo(document.getElementById("chReach"), t.sel, function(v){ return v.toFixed(1) + "M"; });

    // the buyer did not choose, so it is left alone here.
    var opt = (document.querySelector("[data-net='pgam']") || {}).getAttribute

        document.querySelector("section.page.on")) return;
    var h=(location.hash||"#/dashboard").replace(/^#\/?/,"");
    var parts=h.split("/"), name=parts[0]||"dashboard";
    if(PAGES.indexOf(name)===-1) name="dashboard";
    PAGES.forEach(function(p){
      var s=document.getElementById("p-"+p); if(s) s.classList.toggle("on", p===name);
    });
    document.querySelectorAll("nav.main a").forEach(function(a){
      var m = a.dataset.nav===name
           || ((name==="campaign"||name==="new") && a.dataset.nav==="campaigns")
           || ((name==="creatives"||name==="integrations") && a.dataset.nav==="tools");
      if(m) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
    });
    window.scrollTo(0,0);
    if(name==="dashboard"){ hide(); drawMain(); }
    if(name==="campaign") paintCampaign(parts[1]||"retargeting");
    // #/new/3 opens the builder on step 3, so a step can be linked to
    // and a reload does not throw you back to the start.
    if(name==="new"){
      var st = Math.min(5, Math.max(1, parseInt(parts[1], 10) || 1));
      // Normalise an out-of-range step so a shared link never shows
      // "/9" while sitting on step 5. replaceState, not the hash, so it
      // adds no history entry and cannot re-enter the router.
      var canon = "#/new" + (st > 1 ? "/" + st : "");
      if (location.hash !== canon) history.replaceState(null, "", canon);
      gotoStep(st, true); paintGoal();
    }
  }
  window.addEventListener("hashchange",route);

  // ── Budget forecast ─────────────────────────────────────────────
  //
  // The old hint restated the budget with one number attached to it. A
  // forecast is only useful if it moves, and only honest if it carries
  // the spread it was drawn from: this account's campaigns run between
  // $71.72 and $106.25 a lead, so a single figure is the midpoint of a
  // range, never a floor.
  var CPL_BEST = 71.72, CPL_WORST = 106.25, CPL_NOW = 97.06, CPM = 42.23;
  var BURN = 2326, BALANCE = 18240, FLIGHT_DAYS = 28;
  function fInt(n){ return Math.round(n).toLocaleString("en-US"); }
  function paintForecast(){
    var el = document.getElementById("bAmt");
    if (!el) return;
    var amt = Number(el.value) || 0;
    var imp = amt / CPM * 1000;
    var leads = amt / CPL_NOW;
    var daily = amt / FLIGHT_DAYS;
    document.getElementById("fImp").textContent = amt ? fInt(imp) : "—";
    document.getElementById("fLeads").textContent = amt ? fInt(leads) : "—";
    document.getElementById("fDaily").textContent = amt ? "$" + fInt(daily) : "—";
    document.getElementById("fRange").textContent = amt
      ? fInt(amt / CPL_WORST) + " to " + fInt(amt / CPL_BEST) + " leads"
      : "nothing yet";
    document.getElementById("bHint").innerHTML = amt
      ? 'At your $97.06 cost per lead, roughly <b style="color:var(--ink)">' + fInt(leads) +
        ' leads a month</b> — an estimate at today\'s rate, not a commitment.'
      : "Enter a monthly budget to see what it is likely to buy.";
    var rb = document.getElementById("rBud");
    if (rb) rb.textContent = amt ? "$" + fInt(amt) + " / month" : "—";

    // Runway is the whole account's, so a new campaign has to be added
    // to the burn already running — the number people get wrong.
    var newBurn = BURN + daily;
    var days = newBurn > 0 ? Math.floor(BALANCE / newBurn) : null;
    var rw = document.getElementById("bRunway");
    if (rw) rw.textContent = days === null ? "—" : days + (days === 1 ? " day" : " days");
    var w = document.getElementById("bWallet");
    if (w) w.className = days !== null && days < 14 ? "note warn" : "note";
  }
  var bAmt = document.getElementById("bAmt");
  if (bAmt) { bAmt.addEventListener("input", paintForecast); paintForecast(); }

  // ── Sortable campaigns table ────────────────────────────────────
  //
  // Sorting reads the cells rather than a parallel data array, so it
  // cannot disagree with what is on screen, and it skips rows the
  // status filter has hidden.
  (function sortable(){
    var table = document.querySelector("#p-campaigns table.dt");
    if (!table) return;
    var ths = table.querySelectorAll("thead th");
    var tbody = table.querySelector("tbody");
    var order = {};
    ths.forEach(function(th, i){
      if (i === 1) return;                       // Status is a pill, not a scale
      var label = th.textContent.trim();
      th.classList.add("sortable");
      th.innerHTML = '<button type="button"><span>' + label + '</span><span class="ar" aria-hidden="true">▼</span></button>';
      th.querySelector("button").addEventListener("click", function(){
        var dir = order[i] === "asc" ? "desc" : "asc";
        order = {}; order[i] = dir;
        ths.forEach(function(o){ o.removeAttribute("aria-sort"); });
        th.setAttribute("aria-sort", dir === "asc" ? "ascending" : "descending");
        th.querySelector(".ar").textContent = dir === "asc" ? "▲" : "▼";
        var rows = [].slice.call(tbody.querySelectorAll("tr"));
        // A dash is not a zero. Rows with no value sort to the bottom
        // whichever direction is chosen, rather than pretending to be
        // the smallest number in the column.
        function key(tr){
          var c = tr.children[i];
          if (!c) return null;
          var t = c.textContent.replace(/[$,%]/g, "").trim();
          if (t === "—" || t === "") return null;
          var n = parseFloat(t);
          return isNaN(n) ? t.toLowerCase() : n;
        }
        rows.sort(function(a, b){
          var ka = key(a), kb = key(b);
          if (ka === null && kb === null) return 0;
          if (ka === null) return 1;
          if (kb === null) return -1;
          if (typeof ka === "string" || typeof kb === "string")
            return dir === "asc" ? String(ka).localeCompare(kb) : String(kb).localeCompare(ka);
          return dir === "asc" ? ka - kb : kb - ka;
        });
        rows.forEach(function(r){ tbody.appendChild(r); });
      });
    });
  })();

  // ── Help search ─────────────────────────────────────────────────
  //
  // Forty questions is past the point where scanning headings works.
  // Matches on question and answer text, opens what it finds so the
  // match is visible, and hides a topic card once nothing in it
  // survives — an empty card with a heading reads as a dead end.
  var hq = document.getElementById("hq");
  if (hq) {
    var hCount = document.getElementById("hCount");
    var hEmpty = document.getElementById("hEmpty");
    var hCards = [].slice.call(document.querySelectorAll(".helpcard"));
    var hTotal = document.querySelectorAll(".helpcard .faq").length;
    hq.addEventListener("input", function(){
      var q = hq.value.trim().toLowerCase();
      var shown = 0, topics = 0;
      hCards.forEach(function(card){
        var any = 0;
        card.querySelectorAll(".faq").forEach(function(d){
          var hit = !q || d.textContent.toLowerCase().indexOf(q) >= 0;
          d.hidden = !hit;
          if (hit) { any++; shown++; }
          // Open a match so the answer is on screen, and close what was
          // opened by a previous search rather than leaving a trail.
          d.open = q ? hit : d.dataset.wasopen === "1";
        });
        card.hidden = any === 0;
        if (any) topics++;
      });
      hEmpty.hidden = shown > 0;
      hCount.textContent = q
        ? shown + (shown === 1 ? " question" : " questions") + " across " +
          topics + (topics === 1 ? " topic" : " topics")
        : hTotal + " questions across " + hCards.length + " topics";
      var t = document.getElementById("hEmptyT");
      if (t && q) t.textContent = "Nothing matches “" + hq.value.trim() + "”";
    });
    // Remember which one shipped open so clearing the box restores it.
    document.querySelectorAll(".helpcard .faq[open]").forEach(function(d){ d.dataset.wasopen = "1"; });
  }

  // ── Jump to (⌘K) ────────────────────────────────────────────────
  //
  // Twelve screens and five campaigns is past the point where the nav
  // is the fastest way to anywhere. One keystroke, type three letters,
  // enter. The list is built from the routes that exist rather than a
  // hand-kept copy, so it cannot drift out of date.
  var JUMP = [
    ["Dashboard","#/dashboard","screen"],
    ["Campaigns","#/campaigns","screen"],
    ["New campaign","#/new","screen"],
    ["Results","#/results","screen"],
    ["Attention","#/attention","screen"],
    ["Grow","#/grow","screen"],
    ["Tools","#/tools","screen"],
    ["Wallet","#/billing","screen"],
    ["Creatives","#/creatives","screen"],
    ["Integrations","#/integrations","screen"],
    ["Settings","#/settings","screen"],
    ["Help","#/help","screen"],
    ["Add funds","#/billing","action"],
    ["Upload a video","#/creatives","action"],
    ["Where it ran — reporting breakdowns","#/results","section"],
    ["Site tag","#/integrations","section"],
    ["Call tracking","#/integrations","section"],
    ["Dayparting","#/new","section"],
    ["Channel picker","#/new","section"]
  ];
  Object.keys(CAMPAIGNS || {}).forEach(function(k){
    JUMP.push([CAMPAIGNS[k].title, "#/campaign/" + k, "campaign"]);
  });

  var cmdk = document.getElementById("cmdk"), cq = document.getElementById("cmdkq"),
      clist = document.getElementById("cmdklist"), cSel = 0, cRows = [], cPrevFocus = null;

  function cmdkPaint(){
    var q = cq.value.trim().toLowerCase();
    // A brand-new account has no campaigns, so offering to jump to one
    // would open a detail page for something that does not exist.
    var isNew = document.getElementById("main").classList.contains("newacct");
    cRows = JUMP.filter(function(r){
      if (isNew && r[2] === "campaign") return false;
      return !q || r[0].toLowerCase().indexOf(q) >= 0;
    });
    if (cSel >= cRows.length) cSel = Math.max(0, cRows.length - 1);
    clist.innerHTML = cRows.length
      ? cRows.map(function(r, i){
          return '<li><a href="' + r[1] + '" data-i="' + i + '" data-sel="' + (i === cSel ? 1 : 0) +
            '">' + r[0] + '<span class="kind">' + r[2] + '</span></a></li>';
        }).join("")
      : '<li><p class="cmdkempty">Nothing matches “' + cq.value.trim() + '”.</p></li>';
  }
  // aria-modal is a promise to assistive tech, and tabbing straight out
  // of the dialog into the page behind breaks it. `inert` takes the rest
  // of the page out of both focus order and the accessibility tree; the
  // Tab wrap below covers engines that do not support it yet.
  function cmdkChrome(off){
    ["proto", "topbar", "main", "pgfoot"].forEach(function(sel){
      var el = document.getElementById(sel) || document.querySelector("." + sel);
      if (!el) return;
      if (off) { el.setAttribute("inert", ""); el.setAttribute("aria-hidden", "true"); }
      else { el.removeAttribute("inert"); el.removeAttribute("aria-hidden"); }
    });
  }
  function cmdkOpen(){
    cPrevFocus = document.activeElement;
    cmdk.setAttribute("data-open", "1");
    cmdkChrome(true);
    cq.value = ""; cSel = 0; cmdkPaint(); cq.focus();
  }
  function cmdkClose(){
    cmdk.setAttribute("data-open", "0");
    cmdkChrome(false);
    if (cPrevFocus && cPrevFocus.focus) cPrevFocus.focus();
  }
  function cmdkGo(i){
    var r = cRows[i];
    if (!r) return;
    cmdkClose();
    location.hash = r[1];
  }
  if (cmdk) {
    cq.addEventListener("input", function(){ cSel = 0; cmdkPaint(); });
    clist.addEventListener("click", function(e){
      var a = e.target.closest("a[data-i]");
      if (!a) return;
      e.preventDefault();
      cmdkGo(+a.dataset.i);
    });
    cq.addEventListener("keydown", function(e){
      if (e.key === "ArrowDown") { cSel = Math.min(cRows.length - 1, cSel + 1); cmdkPaint(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { cSel = Math.max(0, cSel - 1); cmdkPaint(); e.preventDefault(); }
      else if (e.key === "Enter") { cmdkGo(cSel); e.preventDefault(); }
      else if (e.key === "Escape") { cmdkClose(); e.preventDefault(); }
    });
    cmdk.addEventListener("mousedown", function(e){ if (e.target === cmdk) cmdkClose(); });
    cmdk.addEventListener("keydown", function(e){
      if (e.key !== "Tab") return;
      var f = cmdk.querySelectorAll("input, a[href]");
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    });
    document.addEventListener("keydown", function(e){
      var open = cmdk.getAttribute("data-open") === "1";
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
        e.preventDefault(); open ? cmdkClose() : cmdkOpen(); return;
      }
      if (e.key === "Escape" && open) { cmdkClose(); return; }
      // A bare "/" opens it too, but not while someone is typing into
      // a field — a slash in a ZIP box should be a slash.
      if (e.key === "/" && !open) {
        var t = e.target.tagName;
        if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || e.target.isContentEditable) return;
        e.preventDefault(); cmdkOpen();
      }
    });
    var jb = document.getElementById("jumpBtn");
    if (jb) jb.addEventListener("click", cmdkOpen);
  }

  // ── Account state switch ────────────────────────────────────────
  //
  // This used to change the dashboard only, so switching to a brand-new
  // account left a $0 wallet in the header above eight weeks of spend on
  // every other screen. The flag now reaches every page: sublines swap,
  // funded content is replaced by what is actually true, and the two
  // "connected" claims on Settings become the honest answer.
  var EMPTY_SUB = {
    rgLine: "No delivery in any window",
    "p-campaigns": "Nothing built yet",
    "p-attention": "No campaign scored yet",
    "p-grow": "Nothing to compare against yet",
    "p-billing": "Streaming is prepaid. Nothing serves until the wallet is funded.",
    "p-creatives": "No videos uploaded"
  };
  var LIVE_SUB = {};
  function subOf(id){
    var sec = document.getElementById(id);
    return sec ? sec.querySelector(".pagehead .subline") : null;
  }
  function setState(isNew){
    document.getElementById("stateNew").setAttribute("aria-pressed",String(isNew));
    document.getElementById("stateLive").setAttribute("aria-pressed",String(!isNew));
    document.getElementById("main").classList.toggle("newacct", isNew);
    document.getElementById("dashLive").hidden=isNew;
    document.getElementById("dashNew").hidden=!isNew;
    document.getElementById("dashTitle").textContent=isNew?"Let’s get you on air":"Good morning, Priyesh";
    document.getElementById("dashSub").textContent=isNew
      ? "Four things stand between you and your first campaign. None of them take long."
      : "3 campaigns on air · $81,920 spent these 8 weeks · 844 leads";
    var amt=document.getElementById("walletAmt"), chip=document.getElementById("walletChip");
    amt.textContent=isNew?"$0":"$18,240";
    chip.classList.toggle("low",true);

    Object.keys(EMPTY_SUB).forEach(function(k){
      var el = k === "rgLine" ? document.getElementById("rgLine") : subOf(k);
      if (!el) return;
      if (LIVE_SUB[k] === undefined) LIVE_SUB[k] = el.textContent;
      el.textContent = isNew ? EMPTY_SUB[k] : LIVE_SUB[k];
    });
    // Tools stays useful when empty — setup is the whole job for a new
    // account — so it keeps its cards and only its readiness card changes.
    var rdy = document.getElementById("rdyNew"), rdyLive = document.getElementById("rdyLive");
    if (rdy && rdyLive) { rdy.hidden = !isNew; rdyLive.hidden = isNew; }
    // Tools' corner states are account facts, so they have to move too —
    // a brand-new account showing "577 calls" is the same lie the
    // sublines were telling.
    document.querySelectorAll("[data-newstate]").forEach(function(t){
      if (t.dataset.livestate === undefined) {
        t.dataset.livestate = t.textContent;
        t.dataset.liveclass = t.className;
      }
      t.textContent = isNew ? t.dataset.newstate : t.dataset.livestate;
      t.className = isNew && t.dataset.newwarn ? "tstate warn" : t.dataset.liveclass;
    });
    document.querySelectorAll("[data-livepill]").forEach(function(p){
      if (p.dataset.emptypill === undefined) p.dataset.emptypill = p.dataset.livepill;
      p.className = "pill " + (isNew ? "warn" : "ok");
      p.innerHTML = '<i style="background:var(--' + (isNew ? "warn" : "positive") + ')"></i>' +
        (isNew ? "Not connected" : p.dataset.livepill);
    });
    if(!isNew){ drawMain(); }
  }
  document.getElementById("stateNew").addEventListener("click",function(){setState(true);location.hash="#/dashboard";});
  document.getElementById("stateLive").addEventListener("click",function(){setState(false);location.hash="#/dashboard";});

  var newPage = document.getElementById("p-new");
  if (newPage) {
    // Every control that feeds the rail also writes one of the review
    // fields, so one delegated listener keeps them in step without a
    // call threaded through eight handlers.
    newPage.addEventListener("click", function(){ setTimeout(paintRail, 0); });
    newPage.addEventListener("input", function(){ setTimeout(paintRail, 0); });
  }

  drawMain(); applyCampaignFilter(); paintGoal(); route(); paintRail();
})();
</script>
