name: TB Today (freshness + partial day)

# Answers two questions that the headroom report deliberately cannot:
#
#   * is the TB ETL current, per table?
#   * what has today booked so far, compared like-for-like on hours?
#
# It exists as its own workflow rather than a step in tb-headroom.yml because
# that job's log runs to hundreds of lines, and the GitHub API only serves the
# tail — so a short answer buried at the top of a long log is unreadable to a
# Claude Code session. Here the whole log IS the answer.
#
# READ-ONLY. scripts/tb_freshness.py issues only SELECTs inside a
# `SET TRANSACTION READ ONLY` transaction.
#
# Needs only PGAM_DIRECT_DATABASE_URL, already a repo secret.

on:
  # Pre-merge escape hatch: workflow_dispatch is only offered for workflows
  # already on the default branch, so a push trigger scoped to this file lets
  # it run before merge. REMOVE THIS BLOCK AT MERGE.
  push:
    branches:
      - claude/teqblaze-platform-integration-xhazcl
    paths:
      - .github/workflows/tb-today.yml
      - scripts/tb_freshness.py

  workflow_dispatch:
    inputs:
      date:
        description: "Date to inspect (YYYY-MM-DD). Blank = today UTC."
        required: false
        type: string
      unified_from:
        description: "Also print core.tb_unified's per-day resolution from this date — the figures the Slack alert posts and the P&L row holds."
        required: false
        type: string
      supply_gap:
        description: "Also run the cutover supply-gap report: which publishers earned on legacy and earn nothing on TBX. Set to a window length in days, e.g. 4."
        required: false
        type: string

jobs:
  today:
    name: Freshness and today so far
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PGAM_DIRECT_DATABASE_URL: ${{ secrets.PGAM_DIRECT_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      IN_DATE: ${{ github.event.inputs.date }}
      IN_UNIFIED_FROM: ${{ github.event.inputs.unified_from }}
      IN_SUPPLY_GAP: ${{ github.event.inputs.supply_gap }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet "psycopg[binary]>=3.1.0" python-dotenv

      - name: Verify the DSN is present
        run: |
          if [ -z "$PGAM_DIRECT_DATABASE_URL" ]; then
            echo "::error::PGAM_DIRECT_DATABASE_URL is not set for this repo."
            exit 1
          fi
          echo "DSN present."

      - name: Freshness and today so far
        run: |
          if [ -n "$IN_DATE" ]; then
            python3 scripts/tb_freshness.py --date "$IN_DATE"
          else
            python3 scripts/tb_freshness.py
          fi

      - name: Unified TB resolution
        # Proves against the real warehouse that the Slack alert and the P&L
        # resolve the same figures — same two rollups, same cutover rule, so
        # agreement should be exact. Read-only, no platform call.
        if: inputs.unified_from != ''
        run: python3 scripts/tb_unified_check.py --from "$IN_UNIFIED_FROM"

      - name: Supply gap across the cutover
        # tbx-supply-gap.yml owns the schedule, but workflow_dispatch is only
        # offered for workflows already on the default branch — so until that
        # one merges this is the only way to run the report against real data.
        # Worth keeping afterwards: this workflow is where a session comes to
        # ask the warehouse a question, and the gap is one of those questions.
        if: inputs.supply_gap != ''
        run: |
          pip install --quiet "psycopg2-binary>=2.9"
          if [ "$IN_SUPPLY_GAP" = "rosters" ]; then
            python3 scripts/tbx_supply_gap.py --rosters 15
          else
            python3 scripts/tbx_supply_gap.py --days "$IN_SUPPLY_GAP" || true
          fi
