<!doctype html><meta charset="utf-8"><title>B</title><pre id="out"></pre>
<script>window.__warns=[];var _w=console.warn;console.warn=function(m){window.__warns.push(m);};</script>
<script src="./attune-test.js"></script>
<script>
setTimeout(function(){
  var R=[];
  R.push((window.attune===undefined?'PASS':'FAIL')+' :: no id -> no public API installed');
